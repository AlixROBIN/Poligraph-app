apiVersion: v1
kind: Secret
metadata:
  name: poligraph-secrets
  namespace: poligraph
type: Opaque
stringData:
  GROQ_API_KEY: ""                                  # Rempli par deploy.ps1 depuis .env
  LLM_BACKEND: "ollama"                             # Ollama sur le host via host.docker.internal
  OLLAMA_URL: "http://host.docker.internal:11434"   # Docker Desktop expose le host ici
  OLLAMA_MODEL: "llama3.1:8b"
  GROQ_MODEL: "llama-3.1-8b-instant"               # Fallback si Ollama indisponible
