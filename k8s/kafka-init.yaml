apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init-topics
  namespace: poligraph
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 29092; do echo 'attente kafka…'; sleep 3; done"]
      containers:
        - name: kafka-init
          image: confluentinc/cp-kafka:7.6.1
          command:
            - sh
            - -c
            - |
              kafka-topics --bootstrap-server kafka:29092 \
                --create --if-not-exists \
                --topic raw-articles \
                --partitions 3 \
                --replication-factor 1
              kafka-topics --bootstrap-server kafka:29092 \
                --create --if-not-exists \
                --topic features \
                --partitions 3 \
                --replication-factor 1
              echo "Topics créés : raw-articles, features ✓"
              kafka-topics --bootstrap-server kafka:29092 --list
