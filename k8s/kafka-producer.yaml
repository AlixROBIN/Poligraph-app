apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-producer
  namespace: poligraph
  labels:
    app: kafka-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-producer
  template:
    metadata:
      labels:
        app: kafka-producer
    spec:
      initContainers:
        - name: wait-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -w 2 kafka 29092 </dev/null; do echo 'waiting for kafka...' && sleep 2; done"]
      containers:
        - name: producer
          image: poligraph-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "streaming.producer"]
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:29092"
            - name: SCRAPE_INTERVAL
              value: "300"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      restartPolicy: Always
