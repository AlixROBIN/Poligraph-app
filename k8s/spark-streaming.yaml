apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-streaming
  namespace: poligraph
  labels:
    app: spark-streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-streaming
  template:
    metadata:
      labels:
        app: spark-streaming
    spec:
      initContainers:
        - name: wait-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -w 2 kafka 29092 </dev/null; do echo 'waiting for kafka...' && sleep 2; done"]
      containers:
        - name: spark
          image: poligraph-spark:latest
          imagePullPolicy: IfNotPresent
          command:
            - /opt/spark/bin/spark-submit
            - --packages
            - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
            - --driver-memory
            - "1500m"
            - --master
            - local[1]   # un seul worker Python → une seule copie du modèle en RAM
            - --conf
            - spark.python.worker.memory=512m
            - /opt/spark-jobs/streaming_pipeline.py
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:29092"
            - name: SPARK_CHECKPOINT
              value: "/opt/spark-checkpoint"
            - name: SENTIMENT_MODEL
              value: "lxyuan/distilbert-base-multilingual-cased-sentiments-student"
            - name: TRANSFORMERS_CACHE
              value: "/opt/hf-cache"
            - name: HF_HOME
              value: "/opt/hf-cache"
            - name: SPARK_USER
              value: "root"
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "3500Mi"
              cpu: "2"
          volumeMounts:
            - name: spark-jobs
              mountPath: /opt/spark-jobs
            - name: ivy-cache
              mountPath: /root/.ivy2
            - name: hf-cache
              mountPath: /opt/hf-cache
            - name: spark-checkpoint
              mountPath: /opt/spark-checkpoint
      volumes:
        - name: spark-jobs
          hostPath:
            path: /run/desktop/mnt/host/c/Users/alixc/Documents/inseeProject/spark
            type: Directory
        - name: ivy-cache
          hostPath:
            path: /run/desktop/mnt/host/c/Users/alixc/Documents/inseeProject/output/spark-ivy-cache
            type: DirectoryOrCreate
        - name: hf-cache
          hostPath:
            path: /run/desktop/mnt/host/c/Users/alixc/Documents/inseeProject/output/hf-cache
            type: DirectoryOrCreate
        - name: spark-checkpoint
          hostPath:
            path: /run/desktop/mnt/host/c/Users/alixc/Documents/inseeProject/output/spark-checkpoint
            type: DirectoryOrCreate
      restartPolicy: Always
