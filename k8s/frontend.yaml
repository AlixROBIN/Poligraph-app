apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: poligraph
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
        - name: wait-backend
          image: busybox:1.36
          command: ["sh", "-c", "until nc -w 2 backend 8000 </dev/null; do echo 'waiting for backend...' && sleep 2; done"]
      containers:
        - name: frontend
          image: poligraph-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: REACT_APP_API_URL
              value: "http://localhost:30800"
            - name: HOST
              value: "0.0.0.0"
            - name: WDS_SOCKET_PORT
              value: "3000"
            - name: CHOKIDAR_USEPOLLING
              value: "true"
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1"
          volumeMounts:
            - name: src-code
              mountPath: /app/src
            - name: public-code
              mountPath: /app/public
          startupProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
      volumes:
        - name: src-code
          hostPath:
            path: /run/desktop/mnt/host/c/Users/alixc/Documents/inseeProject/poligraph-app/src
            type: Directory
        - name: public-code
          hostPath:
            path: /run/desktop/mnt/host/c/Users/alixc/Documents/inseeProject/poligraph-app/public
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: poligraph
spec:
  selector:
    app: frontend
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
