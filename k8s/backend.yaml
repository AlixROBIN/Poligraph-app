apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: poligraph
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 29092; do echo 'waiting for kafka...' && sleep 2; done"]
      containers:
        - name: backend
          image: poligraph-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:29092"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: SENTIMENT_MODEL
              value: "lxyuan/distilbert-base-multilingual-cased-sentiments-student"
            - name: LLM_BACKEND
              valueFrom:
                secretKeyRef:
                  name: poligraph-secrets
                  key: LLM_BACKEND
            - name: OLLAMA_URL
              valueFrom:
                secretKeyRef:
                  name: poligraph-secrets
                  key: OLLAMA_URL
            - name: OLLAMA_MODEL
              valueFrom:
                secretKeyRef:
                  name: poligraph-secrets
                  key: OLLAMA_MODEL
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          volumeMounts:
            - name: api-code
              mountPath: /app/api.py
            - name: pipeline-code
              mountPath: /app/pipeline
            - name: streaming-code
              mountPath: /app/streaming
            - name: data
              mountPath: /app/data
            - name: output
              mountPath: /app/output
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: api-code
          hostPath:
            path: /run/desktop/mnt/host/c/Users/alixc/Documents/inseeProject/api.py
            type: File
        - name: pipeline-code
          hostPath:
            path: /run/desktop/mnt/host/c/Users/alixc/Documents/inseeProject/pipeline
            type: Directory
        - name: streaming-code
          hostPath:
            path: /run/desktop/mnt/host/c/Users/alixc/Documents/inseeProject/streaming
            type: Directory
        - name: data
          hostPath:
            path: /run/desktop/mnt/host/c/Users/alixc/Documents/inseeProject/data
            type: DirectoryOrCreate
        - name: output
          hostPath:
            path: /run/desktop/mnt/host/c/Users/alixc/Documents/inseeProject/output
            type: DirectoryOrCreate
        - name: logs
          hostPath:
            path: /run/desktop/mnt/host/c/Users/alixc/Documents/inseeProject/logs
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: poligraph
spec:
  selector:
    app: backend
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
