# docker-compose.kafka.yml — Stack complète avec Kafka + Spark Streaming
# Images : Confluent (Kafka/ZK) + apache/spark
#
# Usage :
#   docker-compose -f docker-compose.kafka.yml up zookeeper kafka kafka-init -d
#   docker-compose -f docker-compose.kafka.yml up -d   # stack complète

services:

  # ── Infrastructure Kafka ───────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost:2181", "30"]
      interval: 10s
      timeout: 35s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"   # accès depuis la machine hôte
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD", "cub", "kafka-ready", "1", "30", "-b", "localhost:9092"]
      interval: 15s
      timeout: 35s
      retries: 10
      start_period: 30s

  # Crée les topics au démarrage
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        kafka-topics --bootstrap-server kafka:29092
          --create --if-not-exists
          --topic raw-articles --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092
          --create --if-not-exists
          --topic features --partitions 3 --replication-factor 1 &&
        echo 'Topics créés : raw-articles, features ✓'
      "
    restart: "no"

  # ── Scraper RSS/Reddit → raw-articles ─────────────────────────────────

  kafka-producer:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    command: ["python", "-m", "streaming.producer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      SCRAPE_INTERVAL: "300"
    volumes:
      - ./streaming:/app/streaming   # hot-reload producer
    restart: unless-stopped

  # ── Spark Structured Streaming : raw-articles → features ──────────────

  spark:
    build:
      context: .
      dockerfile: spark/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /opt/spark/bin/spark-submit
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
        --master local[1]
        --driver-memory 1500m
        --conf spark.python.worker.memory=512m
        /opt/spark-jobs/streaming_pipeline.py
    user: root
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      SPARK_CHECKPOINT: "/tmp/poligraph-checkpoint"
      SENTIMENT_MODEL: "lxyuan/distilbert-base-multilingual-cased-sentiments-student"
      TRANSFORMERS_CACHE: "/tmp/hf-cache"
    volumes:
      - ./spark:/opt/spark-jobs:ro
      - ./data:/opt/spark-data:ro
      - ./output:/opt/spark-output
      - spark-checkpoint:/tmp/poligraph-checkpoint
      - hf-cache:/tmp/hf-cache
    restart: unless-stopped

  # ── FastAPI (consumer features + API Analytics + ML) ──────────────────

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./api.py:/app/api.py           # hot-reload API
      - ./pipeline:/app/pipeline       # hot-reload pipeline ML
      - ./streaming:/app/streaming     # hot-reload consumer/producer
      - ./config.py:/app/config.py
      - ./logger_config.py:/app/logger_config.py
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output
    environment:
      PYTHONUNBUFFERED: "1"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      SENTIMENT_MODEL: "lxyuan/distilbert-base-multilingual-cased-sentiments-student"
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # ── React Dashboard ────────────────────────────────────────────────────

  frontend:
    build:
      context: ./poligraph-app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./poligraph-app/src:/app/src       # hot-reload React
      - ./poligraph-app/public:/app/public
    environment:
      REACT_APP_API_URL: "http://localhost:8000"
      HOST: "0.0.0.0"
      WDS_SOCKET_PORT: "3000"
      CHOKIDAR_USEPOLLING: "true"   # nécessaire sur Windows pour détecter les changements de fichiers
    restart: unless-stopped

volumes:
  spark-checkpoint:
  hf-cache:        # cache HuggingFace partagé entre spark + backend
